name: Build & Release Orion APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v2.7.5-morphe)'
        required: false
        default: ''
      release_name:
        description: 'Release Title'
        required: false
        default: 'Orion Store 2.0 (with Morphe)'
      draft:
        description: 'Create draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > orion-release.keystore
            cat > keystore.properties << EOF
          storeFile=orion-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Release keystore configured from secrets."
          else
            echo "No custom release keystore secret provided; building with default fallback signing config."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APKs (Release & Debug)
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist/
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" dist/Orion-Store-release.apk
          fi
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" dist/Orion-Store-debug.apk
          fi

          cd dist
          sha256sum *.apk > checksums.sha256
          cat checksums.sha256
          cd ..

      - name: Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: orion-store-apks
          path: dist/*
          if-no-files-found: error

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v2.7.5-morphe-$(date +'%Y%m%d%H%M')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ github.event.inputs.release_name || steps.tag_info.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/Orion-Store-release.apk
            dist/Orion-Store-debug.apk
            dist/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
